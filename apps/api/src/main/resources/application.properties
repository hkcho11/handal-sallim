spring.application.name=api
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/handalsallim}
spring.datasource.username=${DB_USER:handalsallim}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
server.servlet.session.timeout=7d
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.auth.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.auth.mail-from=${AUTH_MAIL_FROM:noreply@handalsallim.local}
app.auth.secure-cookies=${AUTH_SECURE_COOKIES:true}
app.auth.check-breaches=${AUTH_CHECK_BREACHES:true}

spring.profiles.group.prod=mail-smtp
