services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 100
      MP_DATABASE: /tmp/mailpit.db
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: handalsallim
      POSTGRES_USER: handalsallim
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handalsallim -d handalsallim"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
