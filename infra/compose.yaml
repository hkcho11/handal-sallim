services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: handalsallim
      POSTGRES_USER: handalsallim
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handalsallim -d handalsallim"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
